
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your money smarter.</p>
        </header>

        <!-- Balance Cards -->
        <div class="cards">

            <div class="card balance">
                <p>Total Balance</p>
                <h2 id="balance">Rs. 0</h2>
            </div>

            <div class="card">
                <p>Total Income</p>
                <h2 id="income" class="green">Rs. 0</h2>
            </div>

            <div class="card">
                <p>Total Expenses</p>
                <h2 id="expense" class="red">Rs. 0</h2>
            </div>

        </div>

        <div class="content">

            <!-- Transaction Form -->
            <div class="panel">
                <h2>Add Transaction</h2>

                <form id="transactionForm">

                    <label>Transaction Name</label>
                    <input type="text" id="name"
                        placeholder="Enter transaction name" required>

                    <label>Amount (PKR)</label>
                    <input type="number" id="amount"
                        placeholder="Enter amount" min="1" required>

                    <label>Transaction Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <label>Category</label>
                    <select id="category">
                        <option>Salary</option>
                        <option>Food</option>
                        <option>Shopping</option>
                        <option>Transport</option>
                        <option>Bills</option>
                        <option>Other</option>
                    </select>

                    <button type="submit">
                        + Add Transaction
                    </button>

                </form>
            </div>

            <!-- Transaction History -->
            <div class="panel">
                <h2>Transaction History</h2>
                <ul id="transactionList"></ul>
            </div>

        </div>

        <!-- Financial Overview -->
        <div class="panel overview">
            <h2>Financial Overview</h2>

            <p>Income</p>
            <div class="progress">
                <div id="incomeBar"></div>
            </div>

            <p>Expenses</p>
            <div class="progress">
                <div id="expenseBar"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
